[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-profile"
version = "0.22.0"
description = "SIGIL/1 proof-carrying execution profile: gate, verify, anchor, MCP middleware, A2A helpers"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "rfc8785>=0.1.4",
  "cryptography>=42",
  "jsonschema>=4",
]

[project.optional-dependencies]
a2a = ["a2a-sdk"]

[project.scripts]
sigil-gate = "sigil.gate:main"
sigil-verify = "sigil.verify:main"
sigil-anchor = "sigil.anchor:main"
sigil-mcp-proxy = "sigil.mcp_proxy:main"
sigil-conformance = "sigil.conformance:main"
sigil-standby = "sigil.standby:main"
sigil-remote-replica = "sigil.remote_replica:main"
sigil-lease-witness = "sigil.lease_witness:main"
sigil-context-gateway = "sigil.context_gateway:main"
sigil-vectors = "sigil.vector_check:main"
sigil-rotate = "sigil.kms_rotate:main"

[tool.setuptools]
packages = ["sigil"]
include-package-data = true

[tool.setuptools.package-data]
sigil = ["SPEC.md", "vectors.json"]
