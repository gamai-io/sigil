name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Compile
        run: python -m compileall -q sigil
      - name: Vectors
        run: sigil-vectors
      - name: Import all modules
        run: python -c "import pkgutil,importlib,sigil; [importlib.import_module('sigil.'+m.name) for m in pkgutil.iter_modules(sigil.__path__)]; print('imports ok')"
