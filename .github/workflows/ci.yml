name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Unit tests + offline conformance
        run: |
          python -m pip install pytest
          python -m pytest -q tests/ --ignore=tests/test_conformance_stack.py
      - name: Compile
        run: python -m compileall -q sigil
      - name: Vectors
        run: sigil-vectors
      - name: Import all modules
        run: python -c "import pkgutil,importlib,sigil; [importlib.import_module('sigil.'+m.name) for m in pkgutil.iter_modules(sigil.__path__)]; print('imports ok')"

  # The image must build from a clean checkout: the wheel is built inside the
  # image, so nothing is read from dist/ (which is gitignored). The smoke test
  # starts the gate read-only as uid 65534 and waits for /health.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image (wheel built inside, no dist/ needed)
        run: docker build -f deploy/Dockerfile -t sigil:ci .
      - name: Smoke test (read-only, non-root, /health)
        run: SIGIL_IMAGE=sigil:ci bash deploy/build.sh

  # Full stack suite on one Python version: gate, verify, anchor, KMS, replica,
  # three lease witnesses, MCP middleware, A2A endpoint, context gateway.
  # All keys/tokens are generated in the job; no repository secrets are used.
  # Checks 17/21/24 need an external Oracle anchor, container isolation, and
  # FreeTSA respectively and are reported as skipped (never as passing).
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Stack conformance (uvicorn subprocesses, generated keys)
        run: python -m pytest -q tests/test_conformance_stack.py -s
