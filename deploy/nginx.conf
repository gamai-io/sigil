worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=gate:10m rate=30r/s;

    server {
        listen 19443 ssl;
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /gate/ {
            limit_req zone=gate burst=60 nodelay;
            proxy_pass http://gate:18100/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location /verify/ {
            proxy_pass http://verify:18101/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /anchor/ {
            proxy_pass http://anchor:18102/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ctx/ {
            proxy_pass http://context:18120/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
