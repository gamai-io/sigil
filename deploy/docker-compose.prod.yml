x-sigil: &sigil
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: sigil:0.22
  restart: unless-stopped
  read_only: true
  user: "65534:65534"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  stop_grace_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [sigil_internal]

services:
  kms:
    <<: *sigil
    command: python -m sigil.kms
    environment:
      SIGIL_KMS_DIR: /kms
      SIGIL_KMS_TOKEN_FILE: /run/secrets/sigil_kms_token
    secrets: [sigil_kms_token]
    volumes:
      - ./runtime/keys/kms:/kms:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18103/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: "0.50"

  gate:
    <<: *sigil
    command: python -m sigil.gate
    depends_on:
      kms:
        condition: service_healthy
    environment:
      SIGIL_DATA: /data
      SIGIL_EFFECTS: /effects
      SIGIL_PUB_DIR: /pub
      SIGIL_CHAIN_ID: ${SIGIL_CHAIN_ID:-sigil-prod-1}
      SIGIL_KMS_URL: http://kms:18103
      SIGIL_KMS_TOKEN_FILE: /run/secrets/sigil_kms_token
      SIGIL_CONTROL_TOKEN_FILE: /run/secrets/sigil_control_token
      SIGIL_APPROVER_TOKEN_FILE: /run/secrets/sigil_approver_token
    secrets: [sigil_kms_token, sigil_control_token, sigil_approver_token]
    volumes:
      - ./runtime/data:/data
      - ./runtime/effects:/effects
      - ./runtime/keys/pub:/pub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "1.00"

  verify:
    <<: *sigil
    command: python -m sigil.verify
    environment:
      SIGIL_PUB_DIR: /pub
    volumes:
      - ./runtime/keys/pub:/pub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18101/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: "0.50"

  anchor:
    <<: *sigil
    command: python -m sigil.anchor
    depends_on:
      gate:
        condition: service_healthy
      kms:
        condition: service_healthy
    environment:
      SIGIL_DATA: /data
      SIGIL_EFFECTS: /effects
      SIGIL_PUB_DIR: /pub
      SIGIL_CHAIN_ID: ${SIGIL_CHAIN_ID:-sigil-prod-1}
      SIGIL_KMS_URL: http://kms:18103
      SIGIL_KMS_TOKEN_FILE: /run/secrets/sigil_kms_token
      SIGIL_GATE: http://gate:18100
      SIGIL_ANCHOR_STRICT_SEQ: "1"
      SIGIL_TSA_ENABLE: "0"
      SIGIL_CONTROL_TOKEN_FILE: /run/secrets/sigil_control_token
    secrets: [sigil_kms_token, sigil_control_token]
    volumes:
      - ./runtime/data:/data
      - ./runtime/effects:/effects
      - ./runtime/keys/pub:/pub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18102/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: "0.50"

  context:
    <<: *sigil
    command: python -m sigil.context_gateway
    environment:
      SIGIL_CTX_DIR: /data/ctx
      SIGIL_CONTROL_TOKEN_FILE: /run/secrets/sigil_control_token
    secrets: [sigil_control_token]
    volumes:
      - ./runtime/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18120/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: "0.50"

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      gate:
        condition: service_healthy
      verify:
        condition: service_healthy
      anchor:
        condition: service_healthy
      context:
        condition: service_healthy
    ports:
      - "${SIGIL_EDGE_BIND:-127.0.0.1}:19443:19443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/tls:/etc/nginx/tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=700,uid=65534,gid=65534
    networks: [sigil_internal, sigil_edge]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O-", "https://127.0.0.1:19443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: "0.25"


networks:
  sigil_internal:
    internal: true
  sigil_edge: {}

secrets:
  sigil_kms_token:
    file: ./runtime/keys/kms/token
  sigil_control_token:
    file: ./runtime/keys/control_token
  sigil_approver_token:
    file: ./runtime/keys/approver_token
